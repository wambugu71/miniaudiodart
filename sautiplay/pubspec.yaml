name: sautiplay
description: "Audio Player for audiophiles"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.6.26

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sautiflow:
    path: ../
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  fl_chart: ^1.2.0

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  path: ^1.9.1
  dart_ytmusic_api:
    path: ../dependencies/dart_ytmusic_api
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  youtube_explode_dart:
    path: ../dependencies/youtube_explode_dart
  flutter_lyric: ^3.0.2
  shimmer: ^3.0.0
  loading_indicator_m3e: ^0.1.1
  file_selector: ^1.1.0
  audio_metadata_reader:
    path: ../dependencies/audio_metadata_reader
  text_scroll: ^0.2.1
  marquee: ^2.2.1
  share_plus: ^10.1.4
  mini_music_visualizer: ^1.1.4
  flutter_native_splash: ^2.4.4
  image: ^4.3.0
  material_color_utilities: ^0.13.0
  showcaseview: ^3.0.0
  package_info_plus: ^9.0.1
  material_3_expressive:
    path: ../dependencies/material_3_expressive
  flutter_m3shapes_extended: ^1.2.0
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  http: ^1.2.0

  # Desktop Media Controls & Notifications
  system_tray: ^2.0.3
  local_notifier: ^0.1.6
  youtube_scrape_api: ^0.1.1

  # Network Protocols (FTP & DLNA)
  ftpconnect: ^2.0.10
  dlna_dart:
    path: ../dependencies/dlna_dart
  path_provider: ^2.1.5

dependency_overrides:
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.17.0
  flutter_to_debian: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/CHANGELOG.md
    - assets/hrirs/
  shaders:
    - shaders/audio_cyber_tunnel.frag
    - shaders/audio_plasma_sphere.frag
    - shaders/audio_neon_spectrum.frag
    - shaders/audio_warp_vortex.frag
    - shaders/audio_solar_flare.frag
    - shaders/audio_cyber_grid.frag
    - shaders/audio_quantum_nebula.frag
    - shaders/audio_electric_ring.frag
    - shaders/audio_bars_3d.frag
    - shaders/audio_kaleidoscope.frag
    - shaders/audio_lattice.frag
    - shaders/audio_biolum_waves.frag
    - shaders/audio_starburst.frag
    - shaders/audio_matrix_rain.frag
    - shaders/audio_vaporwave_sun.frag
    - shaders/audio_cyber_city.frag
    - shaders/audio_quantum_aurora.frag
    - shaders/audio_black_hole.frag
    - shaders/audio_cymatics.frag
    - shaders/audio_particle_vortex.frag
    - shaders/audio_dna_helix.frag
    - shaders/audio_supernova.frag

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.

  # general color for all platform (except android 12+):
  color: "#101922" ##====================================[REQUIRED]==========

  # general image for all platform (except android 12+):
  image: assets/icon/splash.png

  # hide notif bar on android. ios already hides it by default.
  fullscreen: true

  #! ANDROID 12+ configuration:
  android_12:
    # background color
    color: "#101922"

    # center-logo with Android 12 safe-zone padding
    image: assets/icon/splash_android12.png

msix_config:
  display_name: Sautiplay
  publisher_display_name: Sautiplay
  identity_name: sautiplay.app
  logo_path: assets/icon/splash.png

flutter_to_debian:
  bundle_name: sautiplay
  categories:
    - AudioVideo
    - Audio
    - Player
  maintainer: Sautiplay
