name: sautiflow
description: High-fidelity, cross-platform Dart/Flutter audio engine for audiophiles.
version: 0.6.27
homepage: https://sautiflow.nett.to
repository: https://github.com/wambugu71/sautiflow
issue_tracker: https://github.com/wambugu71/sautiflow/issues
topics:
  - dsp
  - audio
  - miniaudio
  - audiophiles
  - equalizer

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  meta: ^1.15.0
  http: ^1.6.0
  ffi: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: any

flutter:
  plugin:
    platforms:
      android:
        package: com.wambugu.sautiflow
        pluginClass: SautiflowPlugin
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true

false_secrets:
  - "/dependencies/youtube_explode_dart/lib/src/videos/youtube_api_client.dart"
  - "/dependencies/youtube_explode_dart/lib/src/reverse_engineering/youtube_http_client.dart"
